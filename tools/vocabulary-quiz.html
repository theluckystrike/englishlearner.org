    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getWordsByLevel(level) {
      return WORD_BANK.filter(w => w.cefr === level);
    }

    function generateQuestions(level, type, count) {
      const pool = getWordsByLevel(level);
      if (pool.length < count) {
        // fallback: merge adjacent levels
        const levels = ['A1','A2','B1','B2','C1','C2'];
        let merged = [];
        const idx = levels.indexOf(level);
        for (let i=Math.max(0,idx-1); i<=Math.min(5,idx+1); i++) {
          merged = merged.concat(WORD_BANK.filter(w => w.cefr === levels[i]));
        }
        if (merged.length < count) merged = WORD_BANK.slice(); // all
        return buildQuestions(shuffleArray(merged).slice(0, count), type);
      }
      return buildQuestions(shuffleArray(pool).slice(0, count), type);
    }

    function buildQuestions(words, type) {
      return words.map(word => {
        const q = { word: word.word, definition: word.definition, example: word.example, pos: word.pos, type };
        if (type === 'multiple') {
          const distractors = WORD_BANK.filter(w => w.word !== word.word && w.cefr === word.cefr).slice(0,3);
          const options = [word.word, ...distractors.map(d => d.word)];
          q.options = shuffleArray(options);
          q.answer = word.word;
          q.question = `What word means "${word.definition}"? (${word.pos})`;
        } else if (type === 'fill') {
          const blank = word.example.replace(new RegExp(word.word, 'i'), '_____');
          q.question = `Fill in the blank: "${blank}" (${word.pos})`;
          q.answer = word.word;
          q.options = []; // not used
        } else if (type === 'matching') {
          const distractors = WORD_BANK.filter(w => w.word !== word.word).slice(0,3);
          const pairs = [{word: word.word, def: word.definition}, ...distractors.map(d => ({word: d.word, def: d.definition}))];
          shuffleArray(pairs);
          q.matchingPairs = pairs; // display both columns
          q.answer = word.word; // we ask to match the given definition
          q.question = `Match the definition: "${word.definition}"`;
          q.options = shuffleArray(pairs.map(p => p.word));
        } else if (type === 'definition') {
          q.question = `Which word matches this definition? "${word.definition}" (${word.pos})`;
          const distractors = WORD_BANK.filter(w => w.word !== word.word).slice(0,3);
          q.options = shuffleArray([word.word, ...distractors.map(d => d.word)]);
          q.answer = word.word;
        }
        return q;
      });
    }
