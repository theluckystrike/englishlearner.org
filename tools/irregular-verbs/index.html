      {base:"throw", past:"threw", pp:"thrown", freq:7},

      {base:"wake", past:"woke", pp:"woken", freq:7},
      {base:"wear", past:"wore", pp:"worn", freq:7},
      {base:"win", past:"won", pp:"won", freq:8},
      {base:"write", past:"wrote", pp:"written", freq:9}
    ];

    // ----- STATE -----
    let score = 0;
    let currentSort = 'alpha'; // 'alpha' or 'freq'
    let searchTerm = '';
    let filteredVerbs = [...verbs];

    // Quiz state
    let quizIndex = 0;
    let quizVerb = verbs[0];

    // Flashcard state
    let fcIndex = 0;

    // DOM refs
    const tableBody = document.getElementById('tableBody');
    const searchInput = document.getElementById('tableSearch');
    const sortBtns = document.querySelectorAll('.sort-btn');
    const scoreDisplay = document.getElementById('scoreDisplay');

    // Quiz
    const quizBase = document.getElementById('quizBase');
    const quizPast = document.getElementById('quizPast');
    const quizParticiple = document.getElementById('quizParticiple');
    const quizSubmit = document.getElementById('quizSubmit');
    const quizNext = document.getElementById('quizNext');
    const quizFeedback = document.getElementById('quizFeedback');

    // Flashcard
    const flashcard = document.getElementById('flashcard');
    const fcBase = document.getElementById('fcBase');
    const fcPast = document.getElementById('fcPast');
    const fcParticiple = document.getElementById('fcParticiple');
    const fcPrev = document.getElementById('fcPrev');
    const fcNext = document.getElementById('fcNext');

    // ----- HELPERS -----
    function normalize(s) { return s.toLowerCase().trim(); }

    function filterAndSort() {
      let list = [...verbs];
      if (searchTerm) {
        const q = normalize(searchTerm);
        list = list.filter(v => 
          normalize(v.base).includes(q) || 
          normalize(v.past).includes(q) || 
          normalize(v.pp).includes(q)
        );
      }
      if (currentSort === 'alpha') {
        list.sort((a,b) => a.base.localeCompare(b.base));
      } else if (currentSort === 'freq') {
        list.sort((a,b) => b.freq - a.freq);
      }
      filteredVerbs = list;
      return list;
    }

    function renderTable() {
      const data = filterAndSort();
      let html = '';
      data.forEach(v => {
        html += `<tr><td>${v.base}</td><td>${v.past}</td><td>${v.pp}</td></tr>`;
      });
      tableBody.innerHTML = html;
    }

    function updateScore(delta = 0) {
      score += delta;
      if (score < 0) score = 0;
      scoreDisplay.textContent = score;
    }

    // ----- TABLE EVENTS -----
    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      renderTable();
    });

    sortBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        sortBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        renderTable();
      });
    });

    // ----- QUIZ -----
    function loadQuiz(index) {
      const v = verbs[index % verbs.length];
      quizVerb = v;
      quizBase.textContent = v.base;
      quizPast.value = '';
      quizParticiple.value = '';
      quizFeedback.textContent = '';
      quizFeedback.className = 'quiz-feedback';
    }

    function checkQuiz() {
      const pastAns = normalize(quizPast.value);
      const ppAns = normalize(quizParticiple.value);
      const correctPast = normalize(quizVerb.past);
      const correctPP = normalize(quizVerb.pp);

      let pastOk = pastAns === correctPast || (correctPast.includes('/') && correctPast.split('/').some(p => normalize(p.trim()) === pastAns));
      let ppOk = ppAns === correctPP || (correctPP.includes('/') && correctPP.split('/').some(p => normalize(p.trim()) === ppAns));

      // edge: if stored includes slash, we already did partial; also direct match
      if (!pastOk && correctPast.includes('/')) {
        const parts = correctPast.split('/').map(p => normalize(p.trim()));
        pastOk = parts.includes(pastAns);
      }
      if (!ppOk && correctPP.includes('/')) {
        const parts = correctPP.split('/').map(p => normalize(p.trim()));
        ppOk = parts.includes(ppAns);
      }

      if (pastOk && ppOk) {
        quizFeedback.textContent = '✅ Perfect! +1 point';
        quizFeedback.className = 'quiz-feedback correct';
        updateScore(1);
      } else {
        let msg = '❌ ';
        if (!pastOk) msg += `Past: ${quizVerb.past} `;
        if (!ppOk) msg += `Participle: ${quizVerb.pp}`;
        quizFeedback.textContent = msg;
        quizFeedback.className = 'quiz-feedback wrong';
      }
    }

    quizSubmit.addEventListener('click', checkQuiz);
    quizNext.addEventListener('click', () => {
      quizIndex = (quizIndex + 1) % verbs.length;
      loadQuiz(quizIndex);
    });

    // ----- FLASHCARD -----
    function loadFlashcard(index) {
      const v = verbs[index % verbs.length];
      fcBase.textContent = v.base;
      fcPast.textContent = v.past;
      fcParticiple.textContent = v.pp;
      flashcard.classList.remove('flipped');
    }

    flashcard.addEventListener('click', () => {
      flashcard.classList.toggle('flipped');
    });

    fcPrev.addEventListener('click', () => {
      fcIndex = (fcIndex - 1 + verbs.length) % verbs.length;
      loadFlashcard(fcIndex);
    });
    fcNext.addEventListener('click', () => {
      fcIndex = (fcIndex + 1) % verbs.length;
      loadFlashcard(fcIndex);
    });

    // ----- TABS -----
    const tabs = document.querySelectorAll('.nav-tab');
    const contents = {
      table: document.getElementById('tab-table'),
      quiz: document.getElementById('tab-quiz'),
      flashcard: document.getElementById('tab-flashcard')
    };

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        Object.keys(contents).forEach(k => contents[k].classList.remove('active'));
        const target = tab.dataset.tab;
        if (contents[target]) contents[target].classList.add('active');
        // reload quiz if needed
        if (target === 'quiz') loadQuiz(quizIndex);
        if (target === 'flashcard') loadFlashcard(fcIndex);
      });
    });

    // ----- INIT -----
    renderTable();
    loadQuiz(0);
    loadFlashcard(0);
    updateScore(0);
  })();
</script>
</body>
</html>
