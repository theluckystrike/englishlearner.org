<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Quiz - Test Your English Words</title>
    <meta name="description" content="Test your English vocabulary with 50 words across 3 levels. Multiple choice quiz with score tracking and category filter for englishlearner.org.">
    <link rel="canonical" href="https://englishlearner.org/tools/vocabulary-quiz">
    <meta property="og:title" content="Vocabulary Quiz - Test Your English Words">
    <meta property="og:description" content="Test your English vocabulary with 50 words across 3 levels. Multiple choice quiz with score tracking and category filter.">
    <meta property="og:url" content="https://englishlearner.org/tools/vocabulary-quiz">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="englishlearner.org">
    <meta name="twitter:card" content="summary_large_image">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Vocabulary Quiz",
        "url": "https://englishlearner.org/tools/vocabulary-quiz",
        "description": "Test your English vocabulary with 50 words across 3 levels. Multiple choice quiz with score tracking and category filter.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "JavaScript"
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 1.5rem; }
        .container { max-width: 800px; width: 100%; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: #38bdf8; text-align: center; }
        .subtitle { text-align: center; margin-bottom: 1.5rem; opacity: 0.8; font-size: 0.95rem; }
        .controls { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-bottom: 1.5rem; }
        .controls select, .controls button { padding: 0.5rem 1rem; border: 1px solid #334155; border-radius: 8px; background: #1e293b; color: #e2e8f0; font-size: 0.95rem; cursor: pointer; }
        .controls select:focus, .controls button:focus { outline: 2px solid #38bdf8; }
        .controls button { background: #38bdf8; color: #0f172a; font-weight: 600; border: none; }
        .controls button:hover { background: #7dd3fc; }
        .score-card { background: #1e293b; border-radius: 12px; padding: 1rem 1.5rem; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; border: 1px solid #334155; }
        .score-card span { font-size: 1.1rem; }
        .score-card .score { color: #38bdf8; font-weight: bold; font-size: 1.3rem; }
        .question-card { background: #1e293b; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; border: 1px solid #334155; }
        .question-number { color: #38bdf8; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .question-word { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; }
        .options { display: flex; flex-direction: column; gap: 0.6rem; }
        .option { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.75rem 1rem; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
        .option:hover { border-color: #38bdf8; background: #1a2332; }
        .option.selected { border-color: #38bdf8; background: #1e3a5f; }
        .option.correct { border-color: #22c55e; background: #14532d; }
        .option.wrong { border-color: #ef4444; background: #450a0a; }
        .feedback { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; font-weight: 500; display: none; }
        .feedback.show { display: block; }
        .feedback.correct { background: #14532d; color: #bbf7d0; }
        .feedback.wrong { background: #450a0a; color: #fecaca; }
        .next-btn { margin-top: 1rem; padding: 0.6rem 1.5rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; display: none; }
        .next-btn:hover { background: #7dd3fc; }
        .next-btn.show { display: inline-block; }
        .result-card { background: #1e293b; border-radius: 12px; padding: 2rem; text-align: center; border: 1px solid #334155; display: none; }
        .result-card.show { display: block; }
        .result-card h2 { color: #38bdf8; margin-bottom: 0.75rem; }
        .result-card .final-score { font-size: 2.5rem; font-weight: 800; color: #38bdf8; }
        .result-card p { margin: 0.5rem 0; }
        .result-card button { margin-top: 1rem; padding: 0.6rem 2rem; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; }
        .result-card button:hover { background: #7dd3fc; }
        .footer { margin-top: 2.5rem; text-align: center; font-size: 0.85rem; opacity: 0.6; border-top: 1px solid #334155; padding-top: 1.5rem; width: 100%; }
        .footer a { color: #38bdf8; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        @media (max-width: 500px) {
            h1 { font-size: 1.5rem; }
            .question-word { font-size: 1.3rem; }
            .score-card { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📚 Vocabulary Quiz</h1>
    <p class="subtitle">Test your English vocabulary — 50 words across 3 levels</p>

    <div class="controls">
        <select id="levelFilter" aria-label="Filter by level">
            <option value="all">All Levels</option>
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>
        <button id="resetBtn">🔄 Reset Quiz</button>
    </div>

    <div class="score-card">
        <span>Score: <span class="score" id="scoreDisplay">0</span> / <span id="totalQuestions">0</span></span>
        <span>Question <span id="currentQ">0</span> of <span id="totalQ">0</span></span>
    </div>

    <div id="quizArea">
        <div class="question-card" id="questionCard">
            <div class="question-number" id="questionNumber">Question 1</div>
            <div class="question-word" id="questionWord">abandon</div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
            <button class="next-btn" id="nextBtn">Next →</button>
        </div>
        <div class="result-card" id="resultCard">
            <h2>🎉 Quiz Complete!</h2>
            <div class="final-score" id="finalScore">0</div>
            <p>out of <span id="finalTotal">0</span> correct</p>
            <p id="resultMessage"></p>
            <button id="restartBtn">🔄 Take Again</button>
        </div>
    </div>

    <footer class="footer">
        <p>© 2025 <a href="https://englishlearner.org">englishlearner.org</a> — Improve your English vocabulary.</p>
    </footer>
</div>

<script>
    (function() {
        const allWords = [
            // Beginner (20)
            { word: "abandon", definition: "to leave behind", options: ["to keep", "to leave behind", "to build", "to ignore"], level: "beginner" },
            { word: "brave", definition: "courageous", options: ["scared", "courageous", "angry", "tired"], level: "beginner" },
            { word: "calm", definition: "peaceful, not excited", options: ["nervous", "peaceful", "loud", "fast"], level: "beginner" },
            { word: "delight", definition: "great pleasure", options: ["sadness", "anger", "great pleasure", "fear"], level: "beginner" },
            { word: "eager", definition: "very excited and interested", options: ["bored", "very excited", "lazy", "confused"], level: "beginner" },
            { word: "fierce", definition: "very strong or aggressive", options: ["gentle", "weak", "very strong", "quiet"], level: "beginner" },
            { word: "gentle", definition: "soft and kind", options: ["rough", "soft and kind", "loud", "fast"], level: "beginner" },
            { word: "harsh", definition: "rough, unpleasant", options: ["smooth", "pleasant", "rough", "soft"], level: "beginner" },
            { word: "ignore", definition: "to pay no attention", options: ["to notice", "to pay no attention", "to help", "to speak"], level: "beginner" },
            { word: "joyful", definition: "very happy", options: ["sad", "very happy", "angry", "tired"], level: "beginner" },
            { word: "keen", definition: "eager or sharp", options: ["dull", "eager", "slow", "weak"], level: "beginner" },
            { word: "lively", definition: "full of energy", options: ["tired", "full of energy", "sad", "quiet"], level: "beginner" },
            { word: "mild", definition: "not strong or severe", options: ["strong", "not strong", "spicy", "bitter"], level: "beginner" },
            { word: "noble", definition: "having high moral qualities", options: ["selfish", "high moral", "rude", "weak"], level: "beginner" },
            { word: "odd", definition: "strange or unusual", options: ["normal", "strange", "common", "simple"], level: "beginner" },
            { word: "prompt", definition: "done quickly", options: ["slow", "done quickly", "late", "lazy"], level: "beginner" },
            { word: "rare", definition: "not common", options: ["common", "not common", "normal", "frequent"], level: "beginner" },
            { word: "shallow", definition: "not deep", options: ["deep", "not deep", "wide", "narrow"], level: "beginner" },
            { word: "tender", definition: "soft and gentle", options: ["rough", "soft and gentle", "hard", "cold"], level: "beginner" },
            { word: "vivid", definition: "bright and clear", options: ["dull", "bright and clear", "dark", "faint"], level: "beginner" },
            // Intermediate (20)
            { word: "ambiguous", definition: "having more than one meaning", options: ["clear", "having one meaning", "having more than one meaning", "simple"], level: "intermediate" },
            { word: "benevolent", definition: "kind and generous", options: ["cruel", "kind and generous", "selfish", "angry"], level: "intermediate" },
            { word: "candid", definition: "honest and direct", options: ["dishonest", "honest and direct", "vague", "secretive"], level: "intermediate" },
            { word: "diligent", definition: "hardworking and careful", options: ["lazy", "hardworking", "careless", "slow"], level: "intermediate" },
            { word: "eloquent", definition: "fluent and persuasive in speaking", options: ["hesitant", "fluent and persuasive", "quiet", "confused"], level: "intermediate" },
            { word: "frugal", definition: "spending money carefully", options: ["wasteful", "spending carefully", "generous", "rich"], level: "intermediate" },
            { word: "gratitude", definition: "feeling of thankfulness", options: ["anger", "thankfulness", "sadness", "jealousy"], level: "intermediate" },
            { word: "hypothetical", definition: "based on assumption", options: ["real", "based on assumption", "proven", "false"], level: "intermediate" },
            { word: "inevitable", definition: "certain to happen", options: ["uncertain", "certain to happen", "avoidable", "rare"], level: "intermediate" },
            { word: "juxtapose", definition: "to place side by side for comparison", options: ["separate", "place side by side", "mix", "ignore"], level: "intermediate" },
            { word: "lucid", definition: "easy to understand", options: ["confusing", "easy to understand", "vague", "complex"], level: "intermediate" },
            { word: "meticulous", definition: "very careful and precise", options: ["careless", "very careful", "quick", "rough"], level: "intermediate" },
            { word: "nostalgia", definition: "longing for the past", options: ["fear of future", "longing for past", "hatred", "excitement"], level: "intermediate" },
            { word: "obsolete", definition: "no longer in use", options: ["modern", "no longer in use", "common", "new"], level: "intermediate" },
            { word: "pragmatic", definition: "dealing with things practically", options: ["idealistic", "practical", "theoretical", "emotional"], level: "intermediate" },
            { word: "resilient", definition: "able to recover quickly", options: ["weak", "able to recover", "rigid", "fragile"], level: "intermediate" },
            { word: "skeptical", definition: "not easily convinced", options: ["trusting", "not easily convinced", "naive", "certain"], level: "intermediate" },
            { word: "tenacious", definition: "holding firmly", options: ["giving up easily", "holding firmly", "weak", "flexible"], level: "intermediate" },
            { word: "ubiquitous", definition: "found everywhere", options: ["rare", "found everywhere", "local", "hidden"], level: "intermediate" },
            { word: "versatile", definition: "able to adapt to many functions", options: ["limited", "able to adapt", "rigid", "simple"], level: "intermediate" },
            // Advanced (10)
            { word: "ameliorate", definition: "to make something better", options: ["to worsen", "to make better", "to ignore", "to destroy"], level: "advanced" },
            { word: "cacophony", definition: "a harsh mixture of sounds", options: ["melody", "harsh sounds", "silence", "rhythm"], level: "advanced" },
            { word: "dichotomy", definition: "a division into two opposite groups", options: ["unity", "division into two", "mixture", "similarity"], level: "advanced" },
            { word: "ephemeral", definition: "lasting for a very short time", options: ["permanent", "short time", "long lasting", "frequent"], level: "advanced" },
            { word: "gregarious", definition: "fond of company; sociable", options: ["shy", "sociable", "hostile", "lonely"], level: "advanced" },
            { word: "languid", definition: "slow and relaxed", options: ["energetic", "slow and relaxed", "tense", "fast"], level: "advanced" },
            { word: "obfuscate", definition: "to make unclear", options: ["to clarify", "to make unclear", "to simplify", "to reveal"], level: "advanced" },
            { word: "perfunctory", definition: "carried out with minimal effort", options: ["thorough", "minimal effort", "enthusiastic", "careful"], level: "advanced" },
            { word: "recalcitrant", definition: "stubbornly uncooperative", options: ["obedient", "stubbornly uncooperative", "helpful", "flexible"], level: "advanced" },
            { word: "sycophant", definition: "a person who flatters to gain advantage", options: ["critic", "flatterer", "leader", "rebel"], level: "advanced" }
        ];

        // Shuffle array (Fisher-Yates)
        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // State
        let currentWords = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let selectedOption = null;
        let currentFilter = 'all';

        const questionNumber = document.getElementById('questionNumber');
        const questionWord = document.getElementById('questionWord');
        const optionsContainer = document.getElementById('optionsContainer');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('nextBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const currentQ = document.getElementById('currentQ');
        const totalQ = document.getElementById('totalQ');
        const totalQuestions = document.getElementById('totalQuestions');
        const resultCard = document.getElementById('resultCard');
        const finalScore = document.getElementById('finalScore');
        const finalTotal = document.getElementById('finalTotal');
        const resultMessage = document.getElementById('resultMessage');
        const restartBtn = document.getElementById('restartBtn');
        const resetBtn = document.getElementById('resetBtn');
        const levelFilter = document.getElementById('levelFilter');
        const questionCard = document.getElementById('questionCard');

        function filterWords(level) {
            if (level === 'all') return allWords.slice();
            return allWords.filter(w => w.level === level);
        }

        function startQuiz() {
            const filtered = filterWords(currentFilter);
            if (filtered.length === 0) {
                // No words for this filter, show message
                questionCard.style.display = 'none';
                resultCard.classList.add('show');
                resultCard.querySelector('h2').textContent = 'No words available';
                finalScore.textContent = '0';
                finalTotal.textContent = '0';
                resultMessage.textContent = 'Please select a different level.';
                restartBtn.textContent = '🔄 Try All Levels';
                return;
            }
            questionCard.style.display = 'block';
            resultCard.classList.remove('show');
            currentWords = shuffle(filtered.slice());
            currentIndex = 0;
            score = 0;
            answered = false;
            selectedOption = null;
            updateScore();
            totalQ.textContent = currentWords.length;
            totalQuestions.textContent = currentWords.length;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= currentWords.length) {
                showResult();
                return;
            }
            const word = currentWords[currentIndex];
            questionNumber.textContent = `Question ${currentIndex + 1} of ${currentWords.length} (${word.level})`;
            questionWord.textContent = word.word;
            // Shuffle options
            const opts = shuffle(word.options.slice());
            optionsContainer.innerHTML = '';
            opts.forEach(opt => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.dataset.value = opt;
                div.addEventListener('click', () => selectOption(div, word));
                optionsContainer.appendChild(div);
            });
            feedback.className = 'feedback';
            feedback.textContent = '';
            feedback.style.display = 'none';
            nextBtn.classList.remove('show');
            answered = false;
            selectedOption = null;
            currentQ.textContent = currentIndex + 1;
        }

        function selectOption(el, word) {
            if (answered) return;
            const allOpts = optionsContainer.querySelectorAll('.option');
            allOpts.forEach(o => o.classList.remove('selected', 'correct', 'wrong'));
            el.classList.add('selected');
            selectedOption = el;
        }

        function checkAnswer() {
            if (!selectedOption || answered) return;
            answered = true;
            const word = currentWords[currentIndex];
            const correctDef = word.definition;
            const allOpts = optionsContainer.querySelectorAll('.option');
            let isCorrect = false;
            allOpts.forEach(o => {
                if (o.dataset.value === correctDef) {
                    o.classList.add('correct');
                }
                if (o === selectedOption && o.dataset.value === correctDef) {
                    isCorrect = true;
                }
            });
            if (selectedOption.dataset.value !== correctDef) {
                selectedOption.classList.add('wrong');
            }
            if (isCorrect) {
                score++;
                feedback.textContent = '✅ Correct!';
                feedback.className = 'feedback correct show';
            } else {
                feedback.textContent = `❌ Incorrect. The correct answer is: "${correctDef}"`;
                feedback.className = 'feedback wrong show';
            }
            updateScore();
            nextBtn.classList.add('show');
        }

        function nextQuestion() {
            if (!answered) {
                checkAnswer();
                return;
            }
            currentIndex++;
            renderQuestion();
        }

        function updateScore() {
            scoreDisplay.textContent = score;
        }

        function showResult() {
            questionCard.style.display = 'none';
            resultCard.classList.add('show');
            finalScore.textContent = score;
            finalTotal.textContent = currentWords.length;
            const pct = Math.round((score / currentWords.length) * 100);
            let msg = '';
            if (pct >= 90) msg = 'Excellent! You have a strong vocabulary.';
            else if (pct >= 70) msg = 'Great job! Keep practicing.';
            else if (pct >= 50) msg = 'Good effort! Review the words you missed.';
            else msg = 'Keep studying! Try again to improve.';
            resultMessage.textContent = msg;
            restartBtn.textContent = '🔄 Try Again';
        }

        function resetQuiz() {
            currentFilter = levelFilter.value;
            startQuiz();
        }

        // Event listeners
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', resetQuiz);
        resetBtn.addEventListener('click', resetQuiz);
        levelFilter.addEventListener('change', function() {
            currentFilter = this.value;
            resetQuiz();
        });

        // Allow pressing Enter to check/next
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (resultCard.classList.contains('show')) {
                    restartBtn.click();
                } else if (nextBtn.classList.contains('show')) {
                    nextBtn.click();
                } else if (!answered) {
                    checkAnswer();
                }
            }
        });

        // Init
        startQuiz();
    })();
</script>
</body>
</html>
