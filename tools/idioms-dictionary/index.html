      { idiom: "Go the extra mile", meaning: "To do more than expected.", example: "She always goes the extra mile for clients.", origin: "Biblical.", category: "body", difficulty: "beginner" },
      { idiom: "In hot water", meaning: "In trouble.", example: "He's in hot water with the boss.", origin: "From cooking.", category: "weather", difficulty: "beginner" },
      { idiom: "It takes two to tango", meaning: "Both parties are responsible.", example: "Don't blame me; it takes two to tango.", origin: "Song title.", category: "emotions", difficulty: "intermediate" }
    ];

    // ---------- STATE ----------
    let bookmarks = JSON.parse(localStorage.getItem('idiomBookmarks') || '[]');
    let currentQuiz = { idiom: null, options: [], correctAnswer: '' };
    let quizAnswered = false;
    let quizCorrectCount = 0;
    let quizTotalCount = 0;

    // DOM refs
    const container = document.getElementById('cardsContainer');
    const searchInput = document.getElementById('searchInput');
    const categoryFilter = document.getElementById('categoryFilter');
    const difficultyFilter = document.getElementById('difficultyFilter');
    const bookmarkFilterBtn = document.getElementById('bookmarkFilterBtn');
    const resultCount = document.getElementById('resultCount');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizFeedback = document.getElementById('quizFeedback');
    const quizNextBtn = document.getElementById('quizNextBtn');
    const quizScore = document.getElementById('quizScore');

    // helpers
    function saveBookmarks() {
      localStorage.setItem('idiomBookmarks', JSON.stringify(bookmarks));
    }

    function isBookmarked(idiom) {
      return bookmarks.includes(idiom.idiom);
    }

    function toggleBookmark(idiom) {
      if (bookmarks.includes(idiom.idiom)) {
        bookmarks = bookmarks.filter(b => b !== idiom.idiom);
      } else {
        bookmarks.push(idiom.idiom);
      }
      saveBookmarks();
      render();
    }

    // filter logic
    function getFiltered() {
      const search = searchInput.value.toLowerCase().trim();
      const cat = categoryFilter.value;
      const diff = difficultyFilter.value;
      const onlyBookmarked = bookmarkFilterBtn.classList.contains('active');

      return idioms.filter(idiom => {
        if (search && !idiom.idiom.toLowerCase().includes(search) && !idiom.meaning.toLowerCase().includes(search)) return false;
        if (cat !== 'all' && idiom.category !== cat) return false;
        if (diff !== 'all' && idiom.difficulty !== diff) return false;
        if (onlyBookmarked && !bookmarks.includes(idiom.idiom)) return false;
        return true;
      });
    }

    function render() {
      const filtered = getFiltered();
      resultCount.textContent = `${filtered.length} idiom${filtered.length !== 1 ? 's' : ''}`;
      if (filtered.length === 0) {
        container.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:2rem; opacity:0.6;">No idioms match your filters.</div>`;
        return;
      }
      let html = '';
      filtered.forEach(idiom => {
        const fav = isBookmarked(idiom) ? 'active' : '';
        const diffClass = idiom.difficulty;
        html += `
          <div class="card" data-idiom="${idiom.idiom}">
            <div class="card-header">
              <h3>${idiom.idiom}</h3>
              <span class="badge ${diffClass}">${idiom.difficulty}</span>
            </div>
            <div class="meaning">${idiom.meaning}</div>
            <div class="example">“${idiom.example}”</div>
            <div class="origin">📜 ${idiom.origin}</div>
            <div class="card-actions">
              <button class="fav-btn ${fav}" data-idiom="${idiom.idiom}" aria-label="Bookmark">⭐</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
      // attach bookmark events
      container.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idiomName = e.currentTarget.dataset.idiom;
          const idiomObj = idioms.find(i => i.idiom === idiomName);
          if (idiomObj) toggleBookmark(idiomObj);
        });
      });
    }

    // ---------- QUIZ ----------
    function generateQuiz() {
      const filtered = getFiltered();
      if (filtered.length < 4) {
        quizQuestion.textContent = 'Not enough idioms for a quiz (need at least 4). Add more filters?';
        quizOptions.innerHTML = '';
        quizFeedback.textContent = '';
        return;
      }
      // pick random idiom as answer
      const correctIdx = Math.floor(Math.random() * filtered.length);
      const correctIdiom = filtered[correctIdx];
      // pick 3 other random distinct
      let others = filtered.filter((_, idx) => idx !== correctIdx);
      others = others.sort(() => Math.random() - 0.5).slice(0, 3);
      const options = [correctIdiom, ...others];
      // shuffle
      const shuffled = options.sort(() => Math.random() - 0.5);
      currentQuiz.idiom = correctIdiom;
      currentQuiz.options = shuffled;
      currentQuiz.correctAnswer = correctIdiom.idiom;
      quizAnswered = false;

      // display question: show meaning, ask for idiom
      quizQuestion.textContent = `Which idiom means: “${correctIdiom.meaning}” ?`;
      quizOptions.innerHTML = shuffled.map(opt => 
        `<button class="quiz-opt" data-idiom="${opt.idiom}">${opt.idiom}</button>`
      ).join('');
      quizFeedback.textContent = '';
      // attach events
      document.querySelectorAll('.quiz-opt').forEach(btn => {
        btn.addEventListener('click', quizAnswerHandler);
      });
    }

    function quizAnswerHandler(e) {
      if (quizAnswered) return;
      const selected = e.currentTarget.dataset.idiom;
      const correct = currentQuiz.correctAnswer;
      const isCorrect = selected === correct;
      quizAnswered = true;
      quizTotalCount++;
      if (isCorrect) quizCorrectCount++;
      quizScore.textContent = `${quizCorrectCount} / ${quizTotalCount}`;

      // mark buttons
      document.querySelectorAll('.quiz-opt').forEach(btn => {
        const idiom = btn.dataset.idiom;
        if (idiom === correct) btn.classList.add('correct');
        else if (idiom === selected && !isCorrect) btn.classList.add('wrong');
        btn.disabled = true;
      });
      quizFeedback.textContent = isCorrect ? '✅ Correct!' : `❌ Wrong. The answer was: ${correct}`;
    }

    quizNextBtn.addEventListener('click', () => {
      generateQuiz();
    });

    // filter change events
    function onFilterChange() {
      render();
      // reset quiz if needed? keep quiz but better regenerate?
      // we just keep current quiz, but if filters change drastically, we can regenerate on next click.
    }

    searchInput.addEventListener('input', onFilterChange);
    categoryFilter.addEventListener('change', onFilterChange);
    difficultyFilter.addEventListener('change', onFilterChange);
    bookmarkFilterBtn.addEventListener('click', () => {
      bookmarkFilterBtn.classList.toggle('active');
      onFilterChange();
    });

    // init
    render();
    generateQuiz();
    // set score display
    quizScore.textContent = `0 / 0`;
  })();
</script>
