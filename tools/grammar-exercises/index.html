  {
    "@context": "https://schema.org",

    "name": "Grammar Exercises Tool",

    "description": "Interactive grammar drills: tenses, articles, prepositions, pronouns. 20 exercises with instant feedback & score.",
    "applicationCategory": "EducationalApplication",

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f1f5f9;
    }
    h1 span {
      color: #38bdf8;
    }
    .subhead {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }
    /* stats row */
    .stats-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem 2rem;
      background: #1e293b;
      padding: 1rem 1.5rem;
      border-radius: 1rem;
      margin-bottom: 1.8rem;
      align-items: center;
    }
    .stat-item {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .stat-label {
      color: #94a3b8;
      font-size: 0.9rem;
      font-weight: 400;
    }
    .stat-value {
      font-weight: 600;
      font-size: 1.3rem;
      color: #f1f5f9;
    }
    .stat-value.accent {
      color: #38bdf8;
    }
    .progress-wrapper {
      flex: 1;
      min-width: 120px;
    }
    .progress-bar-bg {
      background: #0f172a;
      height: 8px;
      border-radius: 20px;
      overflow: hidden;
      width: 100%;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 20px;
      transition: width 0.2s ease;
    }
    .progress-label {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 0.2rem;
      display: flex;
      justify-content: space-between;
    }
    /* filter */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.75rem;
      margin-bottom: 2rem;
    }
    .filter-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 0.4rem 1rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #0f172a;
    }
    .filter-btn:hover {
      background: #334155;
      color: #f1f5f9;
    }
    .filter-btn.active:hover {
      background: #7dd3fc;
    }
    /* exercise cards */
    .exercise-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      margin-bottom: 2.5rem;
    }
    .exercise-card {
      background: #1e293b;
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
      border-left: 4px solid #334155;
      transition: border 0.1s;
    }
    .exercise-card.correct {
      border-left-color: #22c55e;
      background: #1a2e2a;
    }
    .exercise-card.incorrect {
      border-left-color: #ef4444;
      background: #2a1e1e;
    }
    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }
    .exercise-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      background: #0f172a;
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      color: #94a3b8;
      font-weight: 500;
    }
    .exercise-type {
      font-size: 0.75rem;
      color: #64748b;
    }
    .question-text {
      font-size: 1.05rem;
      margin-bottom: 0.8rem;
      font-weight: 450;
    }
    .options-area {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      align-items: center;
    }
    .option-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .option-item input[type="radio"] {
      accent-color: #38bdf8;
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }
    .option-item label {
      cursor: pointer;
      color: #e2e8f0;
    }
    .fill-input {
      background: #0f172a;
      border: 1px solid #334155;
      color: #e2e8f0;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      width: auto;
      min-width: 140px;
      max-width: 220px;
    }
    .fill-input:focus {
      outline: 2px solid #38bdf8;
      border-color: transparent;
    }
    .feedback-area {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .feedback-correct {
      color: #22c55e;
    }
    .feedback-incorrect {
      color: #ef4444;
    }
    .btn-check {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      font-weight: 600;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .btn-check:hover {
      background: #7dd3fc;
    }
    .btn-check:disabled {
      opacity: 0.5;
      pointer-events: none;
    }
    .footer {
      margin-top: 2.5rem;
      text-align: center;
      color: #475569;
      font-size: 0.85rem;
      border-top: 1px solid #1e293b;
      padding: 1.5rem 0;
    }
    .footer small {
      display: block;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 1rem;
    }
    .reset-btn:hover {
      background: #1e293b;
      color: #e2e8f0;
    }
    @media (max-width: 600px) {
      body { padding: 1rem 0.75rem 0; }
      .stats-grid { flex-direction: column; align-items: stretch; gap: 0.8rem; }
      .exercise-card { padding: 1rem; }
    }
  </style>

<body>
<div class="container">
  <header>
    <h1>✧ <span>grammar</span> exercises</h1>
    <div class="subhead">tenses · articles · prepositions · pronouns</div>
  </header>

  <!-- stats + progress -->
  <div class="stats-grid" id="statsPanel">
    <div class="stat-item"><span class="stat-label">Score</span><span class="stat-value accent" id="scoreDisplay">0</span><span class="stat-label">/20</span></div>
    <div class="stat-item"><span class="stat-label">Percent</span><span class="stat-value" id="percentDisplay">0%</span></div>
    <div class="progress-wrapper">
      <div class="progress-bar-bg"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label"><span id="progressLabel">0%</span><span>20 questions</span></div>
    </div>
    <button class="reset-btn" id="resetBtn">⟳ reset</button>
  </div>

  <!-- filter -->
  <div class="filter-bar" id="filterBar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="tenses">Tenses</button>
    <button class="filter-btn" data-filter="articles">Articles</button>
    <button class="filter-btn" data-filter="prepositions">Prepositions</button>
    <button class="filter-btn" data-filter="pronouns">Pronouns</button>
  </div>

  <!-- exercise list -->
  <div class="exercise-list" id="exerciseList"></div>
</div>
<footer class="footer">
  <small>© 2025 englishlearner.org — interactive grammar tool</small>
</footer>
<div style="margin:20px auto;max-width:728px;text-align:center">
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-2241192243363112" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins>

</div>

<script>
  (function() {
    // ----- 20 exercises (real) -----
    const EXERCISES = [
      { id: 0, category: 'tenses', type: 'multiple-choice', question: 'She ___ to the store yesterday.', options: ['go', 'went', 'gone', 'going'], answer: 'went' },
      { id: 1, category: 'tenses', type: 'multiple-choice', question: 'They ___ playing football right now.', options: ['is', 'are', 'was', 'were'], answer: 'are' },
      { id: 2, category: 'tenses', type: 'fill-in', question: 'I ___ (eat) breakfast at 7 AM every day.', answer: 'eat' },
      { id: 3, category: 'tenses', type: 'fill-in', question: 'By next year, she ___ (finish) her degree.', answer: 'will finish' },
      { id: 4, category: 'articles', type: 'multiple-choice', question: 'I saw ___ owl in the tree.', options: ['a', 'an', 'the', 'no article'], answer: 'an' },
      { id: 5, category: 'articles', type: 'multiple-choice', question: '___ sun rises in the east.', options: ['A', 'An', 'The', 'no article'], answer: 'The' },
      { id: 6, category: 'articles', type: 'fill-in', question: 'She is ___ honest woman.', answer: 'an' },
      { id: 7, category: 'articles', type: 'fill-in', question: 'I need ___ new phone.', answer: 'a' },
      { id: 8, category: 'prepositions', type: 'multiple-choice', question: 'He is good ___ math.', options: ['at', 'in', 'on', 'with'], answer: 'at' },
      { id: 9, category: 'prepositions', type: 'multiple-choice', question: 'We will meet ___ 5 PM.', options: ['in', 'on', 'at', 'by'], answer: 'at' },
      { id: 10, category: 'prepositions', type: 'fill-in', question: 'She is afraid ___ spiders.', answer: 'of' },
      { id: 11, category: 'prepositions', type: 'fill-in', question: 'They went ___ vacation last week.', answer: 'on' },
      { id: 12, category: 'pronouns', type: 'multiple-choice', question: '___ is my friend.', options: ['He', 'Him', 'His', 'Her'], answer: 'He' },
      { id: 13, category: 'pronouns', type: 'multiple-choice', question: 'This book is ___.', options: ['my', 'mine', 'me', 'I'], answer: 'mine' },
      { id: 14, category: 'pronouns', type: 'fill-in', question: '___ (we) are going to the park.', answer: 'We' },
      { id: 15, category: 'pronouns', type: 'fill-in', question: 'Please give ___ (I) the pen.', answer: 'me' },
      // error correction (real errors)
      { id: 16, category: 'tenses', type: 'error-correction', question: 'She go to school every day.', hint: 'fix the verb', answer: 'goes' },
      { id: 17, category: 'articles', type: 'error-correction', question: 'He is a honest boy.', hint: 'article error', answer: 'an' },
      { id: 18, category: 'prepositions', type: 'error-correction', question: 'She is good in playing chess.', hint: 'wrong preposition', answer: 'at' },
      { id: 19, category: 'pronouns', type: 'error-correction', question: 'Him and I are friends.', hint: 'pronoun case', answer: 'He' }
    ];

    // state
    let userAnswers = new Array(EXERCISES.length).fill(null);
    let feedbackState = new Array(EXERCISES.length).fill(null); // null | 'correct' | 'incorrect'
    let activeFilter = 'all';

    const exerciseListEl = document.getElementById('exerciseList');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const percentDisplay = document.getElementById('percentDisplay');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const resetBtn = document.getElementById('resetBtn');

    // helpers
    function computeScore() {
      let correct = 0;
      for (let i = 0; i < EXERCISES.length; i++) {
        if (feedbackState[i] === 'correct') correct++;
      }
      return correct;
    }

    function updateStats() {
      const total = EXERCISES.length;
      const correct = computeScore();
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      scoreDisplay.textContent = correct;
      percentDisplay.textContent = pct + '%';
      progressFill.style.width = pct + '%';
      progressLabel.textContent = pct + '%';
    }

    // render all exercises based on filter
    function renderExercises() {
      const filtered = EXERCISES.filter((ex, idx) => {
        if (activeFilter === 'all') return true;
        return ex.category === activeFilter;
      });

      if (filtered.length === 0) {
        exerciseListEl.innerHTML = `<div style="padding: 2rem; text-align: center; color: #64748b;">No exercises in this category.</div>`;
        return;
      }

      let html = '';
      filtered.forEach((ex) => {
        const idx = ex.id;
        const isCorrect = feedbackState[idx] === 'correct';
        const isIncorrect = feedbackState[idx] === 'incorrect';
        const cardClass = isCorrect ? 'exercise-card correct' : (isIncorrect ? 'exercise-card incorrect' : 'exercise-card');
        const userVal = userAnswers[idx] || '';
        const feedbackMsg = feedbackState[idx] === 'correct' ? '✓ Correct!' : (feedbackState[idx] === 'incorrect' ? `✗ Incorrect. Answer: ${ex.answer}` : '');

        let optionsHtml = '';
        let typeLabel = '';
        if (ex.type === 'multiple-choice') {
          typeLabel = 'multiple choice';
          optionsHtml = `<div class="options-area">`;
          ex.options.forEach(opt => {
            const checked = (userVal === opt) ? 'checked' : '';
            optionsHtml += `<div class="option-item"><input type="radio" name="q${idx}" value="${opt}" id="q${idx}_${opt}" ${checked} data-idx="${idx}"><label for="q${idx}_${opt}">${opt}</label></div>`;
          });
          optionsHtml += `<button class="btn-check" data-idx="${idx}" ${feedbackState[idx] ? 'disabled' : ''}>check</button></div>`;
        } else if (ex.type === 'fill-in') {
          typeLabel = 'fill in';
          optionsHtml = `<div class="options-area"><input class="fill-input" type="text" value="${userVal}" placeholder="type answer" data-idx="${idx}" ${feedbackState[idx] ? 'disabled' : ''}><button class="btn-check" data-idx="${idx}" ${feedbackState[idx] ? 'disabled' : ''}>check</button></div>`;
        } else if (ex.type === 'error-correction') {
          typeLabel = 'error correction';
          optionsHtml = `<div class="options-area"><input class="fill-input" type="text" value="${userVal}" placeholder="correct form" data-idx="${idx}" ${feedbackState[idx] ? 'disabled' : ''}><button class="btn-check" data-idx="${idx}" ${feedbackState[idx] ? 'disabled' : ''}>check</button> <span style="font-size:0.8rem;color:#94a3b8;">${ex.hint || ''}</span></div>`;
        }

        html += `<div class="${cardClass}" data-id="${idx}">
          <div class="exercise-header">
            <span class="exercise-category">${ex.category}</span>
            <span class="exercise-type">${typeLabel}</span>
          </div>
          <div class="question-text">${ex.question}</div>
          ${optionsHtml}
          ${feedbackMsg ? `<div class="feedback-area ${isCorrect ? 'feedback-correct' : 'feedback-incorrect'}">${feedbackMsg}</div>` : ''}
        </div>`;
      });
      exerciseListEl.innerHTML = html;

      // attach events (delegation not used because of dynamic, but we attach after render)
      document.querySelectorAll('.btn-check').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const idx = parseInt(this.dataset.idx);
          if (feedbackState[idx] !== null) return; // already answered
          const ex = EXERCISES[idx];
          let answer = '';
          if (ex.type === 'multiple-choice') {
            const radios = document.querySelectorAll(`input[name="q${idx}"]:checked`);
            if (radios.length === 0) return;
            answer = radios[0].value;
          } else {
            const input = document.querySelector(`.fill-input[data-idx="${idx}"]`);
            if (!input) return;
            answer = input.value.trim();
          }
          if (answer === '') return;
          userAnswers[idx] = answer;
          // check
          const isCorrect = answer.toLowerCase() === ex.answer.toLowerCase();
          feedbackState[idx] = isCorrect ? 'correct' : 'incorrect';
          // disable inputs
          if (ex.type === 'multiple-choice') {
            document.querySelectorAll(`input[name="q${idx}"]`).forEach(el => el.disabled = true);
          } else {
            const inp = document.querySelector(`.fill-input[data-idx="${idx}"]`);
            if (inp) inp.disabled = true;
          }
          this.disabled = true;
          updateStats();
          renderExercises(); // re-render to show feedback
        });
      });

      // attach input sync for fill-in (optional)
      document.querySelectorAll('.fill-input').forEach(inp => {
        inp.addEventListener('input', function() {
          const idx = parseInt(this.dataset.idx);
          if (feedbackState[idx] === null) {
            userAnswers[idx] = this.value;
          }
        });
      });
      // radio sync
      document.querySelectorAll('input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function() {
          const idx = parseInt(this.dataset.idx);
          if (feedbackState[idx] === null) {
            userAnswers[idx] = this.value;
          }
        });
      });
    }

    // filter
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        activeFilter = this.dataset.filter;
        renderExercises();
      });
    });

    // reset
    resetBtn.addEventListener('click', function() {
      userAnswers = new Array(EXERCISES.length).fill(null);
      feedbackState = new Array(EXERCISES.length).fill(null);
      updateStats();
      renderExercises();
    });

    // initial render
    renderExercises();
    updateStats();
  })();
</script>
</body>
</html>
